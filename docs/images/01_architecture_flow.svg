<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-etl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="card-grad-etl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accent-bronze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="accent-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <filter id="shadow-etl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrow-etl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad-etl)"/>

  <!-- Matrix Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="95" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">DATA ENGINEERING</text>
    
    <text x="0" y="62" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Advanced ETL &amp; Medallion Lakehouse Architecture</text>
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Azure Data Factory, ADLS Gen2, Apache Spark Engine, Synapse CETAS &amp; Sub-4ms ML Inference</text>
  </g>

  <!-- Stage 1: Ingestion & Bronze -->
  <g transform="translate(60, 170)" filter="url(#shadow-etl)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-etl)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-bronze)"/>
    <text x="24" y="38" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1. BRONZE LAYER</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Raw Ingestion</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Azure Data Factory</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Dynamic Lookup &amp; ForEach</text>
      <text x="16" y="66" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="11">HTTP &amp; SQL Source Sync</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">ADLS Gen2 Bronze</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Raw CSV &amp; JSON Lake</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">abfss://olistdata/bronze/</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">MongoDB Atlas</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Customer &amp; Network Logs</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Enrichment Source</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 290 380 L 340 380" stroke="#fb923c" stroke-width="2.5" fill="none" marker-end="url(#arrow-etl)" stroke-dasharray="4 4"/>

  <!-- Stage 2: Spark Silver Layer -->
  <g transform="translate(345, 170)" filter="url(#shadow-etl)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-etl)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-silver)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">2. SILVER LAYER</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Spark Transformations</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Databricks Engine</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Apache Spark Cluster</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">OAuth Token Provider</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Data Cleansing</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Null Trap &amp; Drift Handling</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Deduplication &amp; Joins</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Parquet Compression</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Snappy Columnar Format</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">abfss://olistdata/silver/</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 575 380 L 625 380" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-etl)" stroke-dasharray="4 4"/>

  <!-- Stage 3: Synapse Gold Layer -->
  <g transform="translate(630, 170)" filter="url(#shadow-etl)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-etl)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-gold)"/>
    <text x="24" y="38" fill="#fde047" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">3. GOLD LAYER</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Synapse Analytics</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Synapse Serverless</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Database Scoped Creds</text>
      <text x="16" y="66" fill="#fde047" font-family="-apple-system, sans-serif" font-size="11">CETAS Table Execution</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Curated Marts</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Business Aggregations</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Gold Parquet Partitions</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">BI &amp; Power BI</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Direct Lakehouse Query</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Executive Dashboards</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 860 380 L 910 380" stroke="#fde047" stroke-width="2.5" fill="none" marker-end="url(#arrow-etl)" stroke-dasharray="4 4"/>

  <!-- Stage 4: FastAPI Serving -->
  <g transform="translate(915, 170)" filter="url(#shadow-etl)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-etl)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-silver)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">4. ML SERVING</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Real-Time Ops</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">FastAPI ML Engine</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Network Security Inference</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">P95 Latency &lt; 4ms</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Ensemble Pipeline</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">KNNImputer + RobustScaler</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">XGBoost &amp; CatBoost</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">One-Click Deploy</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">bootstrap.sh | deploy.sh</text>
      <text x="16" y="66" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="11">Zero-Cost Teardown ($0)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 620)">
    <text x="0" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Single-Command Cloud Bootstrap: curl -fsSL https://raw.githubusercontent.com/KishorKumarParoi/Advanced_ETL_Project/main/bootstrap.sh | bash</text>
    <text x="1080" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">✓ $0.00 Teardown Verified (clear.sh)</text>
  </g>
</svg>
